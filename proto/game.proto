syntax = "proto3";

package gatepb;

message Meta {
    string service_name = 1;
    string method_name = 2;
    int32 message_type = 3;
    int64 client_seq = 4;
    int64 server_seq = 5;
    int64 error_code = 6;
    string error_message = 7;
    map<string, bytes> metadata = 8;
}

message Message {
    Meta meta = 1;
    bytes body = 2;
}
